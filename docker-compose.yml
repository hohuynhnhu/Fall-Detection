# docker-compose.yml
services:

  detector:
    build:
      context: .
      dockerfile: docker/Dockerfile.detector
    runtime: nvidia                # Xóa dòng này nếu không dùng GPU
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./src/detection:/app/detection
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./src/api:/app/api
      - ./src/medical:/app/medical
      - ./src/alert:/app/alert
      - ./data/profiles:/app/profiles
    environment:
      - DATABASE_URL=postgresql://admin:secret@db:5432/fall_detection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=fall_detection
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"               # Xóa nếu không cần truy cập DB từ ngoài
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"               # Xóa nếu không cần truy cập Redis từ ngoài
    restart: unless-stopped

volumes:
  postgres_data: